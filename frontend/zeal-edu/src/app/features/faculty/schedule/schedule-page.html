<div class="flex flex-col">
  <div class="flex items-start justify-between gap-3">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Teaching schedule</h1>
      <p class="text-muted-foreground text-sm">
        Teaching schedule for active batches assigned to you.
      </p>
    </div>
    <button hlmBtn variant="outline" size="sm" type="button" (click)="onRefresh()">
      <ng-icon hlm name="lucideRefreshCw" size="sm" />
      Refresh
    </button>
  </div>

  <app-upcoming-class-alert class="my-3" />

  <section hlmCard>
    <div hlmCardHeader>
      <app-faculty-schedule-filter-bar
        [initial]="initialFilter"
        (filterChanged)="onFilterChanged($event)"
      />
    </div>
    <div hlmCardContent>
      @if (scheduleQuery.isError()) {
        <p class="text-destructive text-sm">Failed to load schedule. Please try again.</p>
      } @else {
        <app-faculty-schedule-table
          [page]="scheduleQuery.data()"
          [isLoading]="scheduleQuery.isPending()"
          [pageSize]="pageSize()"
          [sortBy]="sortBy()"
          [sortDirection]="sortDirection()"
          (markAttendanceClicked)="onMarkAttendance($event)"
          (pageChanged)="onPageChanged($event)"
          (pageSizeChanged)="onPageSizeChanged($event)"
          (sortChanged)="onSortChanged($event)"
        />
      }
    </div>
  </section>
</div>
