<section class="flex flex-col gap-6">
  <header class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Feedback</h1>
      <p class="text-muted-foreground mt-1 max-w-2xl text-sm">
        Review feedback from candidates and mark items as processed once they have been addressed.
        Processed items are hidden by default — switch the view filter to bring them back.
      </p>
    </div>
  </header>

  <section hlmCard>
    <div hlmCardHeader>
      <app-feedback-filter-bar
        [initial]="initialFilter"
        (filterChanged)="onFilterChanged($event)"
      />
    </div>
    <div hlmCardContent>
      <app-feedback-table
        [page]="listQuery.data()"
        [isLoading]="listQuery.isPending()"
        [pageSize]="pageSize()"
        [sortBy]="sortBy()"
        [sortDirection]="sortDirection()"
        (viewClicked)="onViewClicked($event)"
        (toggleProcessedClicked)="onToggleProcessedClicked($event)"
        (pageChanged)="onPageChanged($event)"
        (pageSizeChanged)="onPageSizeChanged($event)"
        (sortChanged)="onSortChanged($event)"
      />
    </div>
  </section>

  <app-feedback-detail-dialog
    #detailDialog
    [submitting]="setProcessedMutation.isPending()"
    (toggleProcessed)="onToggleProcessedClicked($event)"
  />
</section>
