<section class="flex flex-col gap-6">
  <header class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Candidates</h1>
      <p class="text-muted-foreground mt-1 max-w-2xl text-sm">
        Search candidates, update their information, and apply fines.
      </p>
    </div>
  </header>

  <app-registrations-trend-chart
    [data]="trendQuery.data()"
    [isLoading]="trendQuery.isPending()"
    [range]="trendRange()"
    (rangeChanged)="onTrendRangeChanged($event)"
  />

  <section hlmCard>
    <div hlmCardHeader>
      <app-candidate-filter-bar
        [initial]="initialFilter"
        (filterChanged)="onFilterChanged($event)"
      />
    </div>
    <div hlmCardContent>
      <app-candidate-table
        [page]="listQuery.data()"
        [isLoading]="listQuery.isPending()"
        [pageSize]="pageSize()"
        [sortBy]="sortBy()"
        [sortDirection]="sortDirection()"
        (viewClicked)="onViewClicked($event)"
        (editClicked)="onEditClicked($event)"
        (fineClicked)="onFineClicked($event)"
        (resetPasswordClicked)="onResetPasswordClicked($event)"
        (pageChanged)="onPageChanged($event)"
        (pageSizeChanged)="onPageSizeChanged($event)"
        (sortChanged)="onSortChanged($event)"
      />
    </div>
  </section>

  <app-candidate-update-dialog
    #updateDialog
    [submitting]="updateMutation.isPending()"
    (submitted)="onUpdateSubmitted($event)"
  />

  <app-apply-fine-dialog
    #fineDialog
    [submitting]="applyFineMutation.isPending()"
    (submitted)="onApplyFineSubmitted($event)"
  />

  <app-confirm-dialog
    #resetConfirm
    (confirmed)="onResetConfirmed()"
    (cancelled)="onResetCancelled()"
  />

  <app-reset-password-result-dialog #resetResultDialog />
</section>
