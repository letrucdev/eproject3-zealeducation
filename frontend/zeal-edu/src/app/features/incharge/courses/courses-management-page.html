<section class="flex flex-col gap-6">
  <header class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Courses</h1>
      <p class="text-muted-foreground mt-1 max-w-2xl text-sm">
        Manage course offerings: create new courses, update details, and toggle availability.
      </p>
    </div>
  </header>

  <app-course-stats-cards
    [stats]="statsQuery.data()"
    [isLoading]="statsQuery.isPending()"
  />

  <section hlmCard>
    <div hlmCardHeader>
      <app-course-filter-bar
        [initial]="initialFilter"
        (filterChanged)="onFilterChanged($event)"
        (createClicked)="onCreateClicked()"
      />
    </div>
    <div hlmCardContent>
      <app-course-table
        [page]="listQuery.data()"
        [isLoading]="listQuery.isPending()"
        [pageSize]="pageSize()"
        [sortBy]="sortBy()"
        [sortDirection]="sortDirection()"
        (editClicked)="onEditClicked($event)"
        (pageChanged)="onPageChanged($event)"
        (pageSizeChanged)="onPageSizeChanged($event)"
        (sortChanged)="onSortChanged($event)"
      />
    </div>
  </section>

  <app-course-form-dialog
    #formDialog
    [submitting]="isSubmittingForm()"
    (submitted)="onFormSubmitted($event)"
  />
</section>
