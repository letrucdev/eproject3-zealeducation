<hlm-dialog #dlg>
  <hlm-dialog-content *hlmDialogPortal class="sm:max-w-[400px]" [showCloseButton]="true">
    <div hlmDialogHeader>
      <h3 hlmDialogTitle>Update Condition</h3>
      <p class="text-muted-foreground text-sm">
        Update the current condition status of the asset.
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 py-4">
      <hlm-field>
        <label hlmFieldLabel>Condition Status</label>
        <hlm-select formControlName="conditionStatus" [itemToString]="statusLabel" class="w-full">
          <hlm-select-trigger class="w-full">
            <hlm-select-value />
          </hlm-select-trigger>
          <hlm-select-content *hlmSelectPortal>
            <hlm-select-item value="Good">Good</hlm-select-item>
            <hlm-select-item value="Maintenance">Maintenance</hlm-select-item>
            <hlm-select-item value="Faulty">Faulty</hlm-select-item>
          </hlm-select-content>
        </hlm-select>
        <hlm-field-error validator="required">Condition Status is required.</hlm-field-error>
      </hlm-field>

      <div hlmDialogFooter class="mt-4">
        <button hlmBtn variant="outline" type="button" hlmDialogClose>Cancel</button>
        <button hlmBtn type="submit" [disabled]="submitting() || form.invalid">
          @if (submitting()) { Updating... } @else { Update }
        </button>
      </div>
    </form>
  </hlm-dialog-content>
</hlm-dialog>
