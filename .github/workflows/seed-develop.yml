name: Seed develop database

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Which seed dataset to apply'
        type: choice
        default: demo
        options:
          - demo
          - demo+chart
      pull_latest:
        description: 'git pull origin develop before seeding (uses latest seed scripts)'
        type: boolean
        default: true

jobs:
  seed:
    name: SSH & sqlcmd seed
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: Run seed scripts over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATASET: ${{ inputs.dataset }}
          PULL_LATEST: ${{ inputs.pull_latest }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DATASET,PULL_LATEST
          script: |
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}

            if [ "$PULL_LATEST" = "true" ]; then
              echo "==> Pulling latest develop"
              git fetch origin develop
              git reset --hard origin/develop
            fi

            echo "==> Verifying mssql container is running"
            if ! docker compose ps --status running --services | grep -q '^mssql$'; then
              echo "ERROR: mssql service is not running. Start the stack first (docker compose up -d)."
              exit 1
            fi

            echo "==> Copying seed scripts into mssql container"
            docker compose cp backend/scripts/seed mssql:/tmp/seed

            echo "==> Running demo seed (01- → 19-)"
            docker compose exec -T mssql bash -lc '
              for f in /tmp/seed/demo/*.sql; do
                echo "==> $f"
                /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" \
                    -C -d ZealEducationDb -b -i "$f" || exit 1
              done
            '

            if [ "$DATASET" = "demo+chart" ]; then
              echo "==> Running chart seed"
              docker compose exec -T mssql bash -lc '
                for f in /tmp/seed/chart/*.sql; do
                  echo "==> $f"
                  /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" \
                      -C -d ZealEducationDb -b -i "$f" || exit 1
                done
              '
            fi

            echo "==> Cleaning up seed scripts in container"
            docker compose exec -T mssql rm -rf /tmp/seed

            echo "==> Done"
